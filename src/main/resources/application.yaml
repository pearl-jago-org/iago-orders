server:
  port: 8080
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}?currentSchema=orders
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 0   # Fuerza creación del DataSource en el arranque

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_orders
    default-schema: orders
    baseline-on-migrate: true
    validate-on-migrate: true
    fail-on-missing-locations: true

logging:
  level:
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.boot.autoconfigure.jdbc: DEBUG

debug: true
